name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Debug npm auth
        run: |
          npm config list
          cat ~/.npmrc 2>/dev/null | grep -v _authToken || echo "no .npmrc"

      - name: Publish to npm
        run: npm publish --provenance --access public
